name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @realbulls/db generate

      - name: Typecheck
        run: pnpm --filter @realbulls/shared --filter @realbulls/db --filter @realbulls/api --filter @realbulls/engine typecheck

      - name: Engine tests
        run: pnpm --filter @realbulls/engine test

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go build + vet
        working-directory: apps/ws-gateway
        run: |
          go build ./...
          go vet ./...

      - name: Web build
        run: pnpm --filter @realbulls/web build
